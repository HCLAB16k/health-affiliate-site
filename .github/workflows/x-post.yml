# Daily X (Twitter) announcement of reviewed posts in org/social/queue/ (decision D0010).
# Target: around 21:00 JST for article announcements ("link" posts) and a
# short link-free fact post ("fact", 2-3 a week) earlier in the day, 12-17h JST.
# GitHub's scheduler can start jobs hours late, so the job is scheduled hourly;
# the first run that starts inside the window posts, and a per-day cache key
# stops the later runs from posting again.
name: X post

on:
  schedule:
    # Hourly from 12:37 to 22:37 JST. GitHub has started these jobs about
    # 6-7 hours late, so start early; only a run that actually begins inside
    # the 18-23h JST window posts.
    - cron: "37 3-13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be posted"
        type: boolean
        default: true
      date:
        description: "Override date (YYYY-MM-DD, Japan time). Empty = today"
        required: false
      kind:
        description: "link or fact (manual runs only; scheduled runs do both)"
        required: false
        default: "link"

permissions:
  contents: read

concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - kind: link
            window: "18-23"
            marker: "x-posted"
          - kind: fact
            window: "12-17"
            marker: "x-posted-fact"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Japan date
        id: jst
        run: echo "date=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
      - name: Already posted today?
        if: github.event_name == 'schedule'
        id: done
        uses: actions/cache/restore@v4
        with:
          path: .x-posted
          key: ${{ matrix.marker }}-${{ steps.jst.outputs.date }}
      - name: Post today's items
        if: steps.done.outputs.cache-hit != 'true'
        id: post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          DATE_OVERRIDE: ${{ inputs.date }}
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          KIND: ${{ github.event_name == 'workflow_dispatch' && inputs.kind || matrix.kind }}
          WINDOW: ${{ matrix.window }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$KIND" != "${{ matrix.kind }}" ]; then echo "manual run for $KIND; skipping ${{ matrix.kind }}"; exit 0; fi
          args=(--kind "$KIND")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$DATE_OVERRIDE" ]; then args+=(--date "$DATE_OVERRIDE"); fi
          if [ "$SCHEDULED" = "true" ]; then args+=(--window "$WINDOW"); fi
          python3 scripts/x_post.py "${args[@]}" | tee out.txt
          if grep -q "HTTP 201\|already posted" out.txt; then echo "posted=true" >> "$GITHUB_OUTPUT"; fi
      - name: Remember today's post
        if: github.event_name == 'schedule' && steps.post.outputs.posted == 'true'
        run: mkdir -p .x-posted && touch .x-posted/done
      - name: Save marker
        if: github.event_name == 'schedule' && steps.post.outputs.posted == 'true'
        uses: actions/cache/save@v4
        with:
          path: .x-posted
          key: ${{ matrix.marker }}-${{ steps.jst.outputs.date }}
