# Daily X (Twitter) announcement of reviewed posts in org/social/queue/ (decision D0010).
name: X post

on:
  schedule:
    - cron: "7 3 * * *" # 12:07 JST every day
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be posted"
        type: boolean
        default: true
      date:
        description: "Override date (YYYY-MM-DD, Japan time). Empty = today"
        required: false

permissions:
  contents: read

concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post today's items
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          DATE_OVERRIDE: ${{ inputs.date }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$DATE_OVERRIDE" ]; then args+=(--date "$DATE_OVERRIDE"); fi
          python3 scripts/x_post.py "${args[@]}"
